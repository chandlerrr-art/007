services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-007}
      POSTGRES_USER: ${POSTGRES_USER:-007}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-007-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-007} -d ${POSTGRES_DB:-007}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./services/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://007:007-local-only@db:5432/007}
      ALLOWED_TARGET_ORIGINS: ${ALLOWED_TARGET_ORIGINS:-http://demo-app:8080}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      demo-app:
        condition: service_healthy

  demo-app:
    build: ./fixtures/demo-app
    environment:
      DEMO_FIX_IDOR: ${DEMO_FIX_IDOR:-false}
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
